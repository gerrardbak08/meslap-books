<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MeslapBooks Admin</title>
<style>
  :root {
    --bg: #FAFAF8; --bg2: #F2EFE8; --ink: #1A1714; --ink2: #5C554E; --ink3: #9A9089;
    --gold: #9A7B4F; --gold-bg: #FDF8EE; --line: #E5DECF; --red: #C0392B;
    --sans: 'Pretendard Variable', 'Pretendard', -apple-system, sans-serif;
    --ease: cubic-bezier(.22,.68,0,1.2);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); min-height: 100dvh; }

  /* ── 로그인 화면 ── */
  .login-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 40px 24px; gap: 24px; }
  .login-logo { font-size: 22px; font-weight: 800; letter-spacing: -.5px; color: var(--gold); }
  .login-title { font-size: 18px; font-weight: 700; color: var(--ink); }
  .login-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
  .login-input { padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 12px;
    font-family: var(--sans); font-size: 15px; background: var(--bg); color: var(--ink);
    outline: none; transition: border-color .15s; }
  .login-input:focus { border-color: var(--gold); }
  .login-btn { padding: 14px; background: var(--ink); color: var(--bg); border: none;
    border-radius: 12px; font-family: var(--sans); font-size: 15px; font-weight: 700;
    cursor: pointer; transition: opacity .15s; }
  .login-btn:active { opacity: .8; }
  .login-err { font-size: 13px; color: var(--red); text-align: center; display: none; }
  .login-err.show { display: block; }

  /* ── 대시보드 ── */
  .admin-wrap { display: none; flex-direction: column; min-height: 100dvh; }
  .admin-wrap.show { display: flex; }
  .admin-header { display: flex; align-items: center; justify-content: space-between;
    padding: calc(env(safe-area-inset-top) + 16px) 20px 16px;
    border-bottom: 1px solid var(--line); background: var(--bg); }
  .admin-brand { font-size: 17px; font-weight: 800; color: var(--gold); }
  .admin-logout { padding: 8px 14px; background: none; border: 1.5px solid var(--line);
    border-radius: 20px; font-family: var(--sans); font-size: 13px; font-weight: 600;
    color: var(--ink2); cursor: pointer; }

  /* ── 탭 ── */
  .admin-tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--bg); }
  .admin-tab { flex: 1; padding: 13px 8px; background: none; border: none; border-bottom: 2px solid transparent;
    font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink3);
    cursor: pointer; transition: color .15s, border-color .15s; }
  .admin-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  /* ── 콘텐츠 패널 ── */
  .admin-body { flex: 1; overflow-y: auto; padding: 20px; }
  .tab-panel { display: none; flex-direction: column; gap: 16px; }
  .tab-panel.active { display: flex; }

  /* ── 카드 ── */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat-card { background: var(--bg2); border-radius: 14px; padding: 18px 16px; }
  .stat-label { font-size: 12px; font-weight: 600; color: var(--ink3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
  .stat-value { font-size: 28px; font-weight: 800; color: var(--ink); }
  .stat-sub { font-size: 12px; color: var(--ink3); margin-top: 4px; }

  .section-title { font-size: 14px; font-weight: 700; color: var(--ink2); padding: 4px 0 8px;
    border-bottom: 1px solid var(--line); }
  .info-row { display: flex; justify-content: space-between; align-items: center;
    padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-key { color: var(--ink3); font-size: 13px; }
  .info-val { font-weight: 600; color: var(--ink); word-break: break-all; max-width: 60%; text-align: right; }

  /* ── 초대코드 ── */
  .code-list { display: flex; flex-direction: column; gap: 8px; }
  .code-item { display: flex; align-items: center; justify-content: space-between;
    background: var(--bg2); border-radius: 10px; padding: 12px 14px; gap: 10px; }
  .code-text { font-family: monospace; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: var(--ink); }
  .code-copy-btn { padding: 7px 14px; background: var(--ink); color: var(--bg);
    border: none; border-radius: 8px; font-family: var(--sans); font-size: 12px;
    font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .code-gen-btn { width: 100%; padding: 14px; background: var(--bg2); border: 1.5px dashed var(--line);
    border-radius: 12px; font-family: var(--sans); font-size: 14px; font-weight: 600;
    color: var(--gold); cursor: pointer; transition: background .15s; }
  .code-gen-btn:active { background: var(--line); }

  /* ── 토스트 ── */
  .toast { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 24px); left: 50%;
    transform: translateX(-50%) translateY(20px); background: rgba(26,23,20,.88);
    color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: 600;
    opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .danger-btn { width: 100%; padding: 14px; background: none; border: 1.5px solid #E8C8C0;
    border-radius: 12px; font-family: var(--sans); font-size: 14px; font-weight: 600;
    color: var(--red); cursor: pointer; }

  /* ── 챌린지 ── */
  .admin-sec { background: var(--bg2); border-radius: 14px; padding: 16px; }
  .admin-sec-lbl { font-size: 12px; font-weight: 700; color: var(--ink3); text-transform: uppercase;
    letter-spacing: .5px; margin-bottom: 12px; }
  .admin-stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .admin-stat { text-align: center; background: var(--bg); border-radius: 10px; padding: 12px 6px; }
  .admin-stat-val { font-size: 22px; font-weight: 800; color: var(--ink); }
  .admin-stat-key { font-size: 11px; color: var(--ink3); margin-top: 3px; }
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div class="login-wrap" id="loginView">
  <div class="login-logo">MeslapBooks</div>
  <div class="login-title">관리자 로그인</div>
  <div class="login-form">
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 맞지 않습니다</div>
  </div>
</div>

<!-- 대시보드 -->
<div class="admin-wrap" id="adminView">
  <div class="admin-header">
    <div class="admin-brand">⚙ Admin</div>
    <button class="admin-logout" onclick="doLogout()">로그아웃</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab active" data-tab="dash" onclick="switchTab('dash')">대시보드</button>
    <button class="admin-tab" data-tab="codes" onclick="switchTab('codes')">초대코드</button>
    <button class="admin-tab" data-tab="reader" onclick="switchTab('reader')">독자</button>
    <button class="admin-tab" data-p="challenge" onclick="switchTab('challenge')">챌린지</button>
  </div>

  <div class="admin-body">

    <!-- 대시보드 탭 -->
    <div class="tab-panel active" id="tab-dash">
      <div class="stat-grid" id="statGrid"></div>
      <div class="section-title">로컬 스토리지 항목</div>
      <div id="lsItems"></div>
      <button class="danger-btn" onclick="clearAllData()">🗑 모든 로컬 데이터 초기화</button>
    </div>

    <!-- 초대코드 탭 -->
    <div class="tab-panel" id="tab-codes">
      <div class="section-title">저장된 초대코드</div>
      <div class="code-list" id="codeList"></div>
      <button class="code-gen-btn" onclick="genCode()">+ 새 코드 생성</button>
    </div>

    <!-- 독자 탭 -->
    <div class="tab-panel" id="tab-reader">
      <div class="section-title">현재 기기 독자 정보</div>
      <div id="readerInfo"></div>
    </div>

    <!-- 챌린지 탭 -->
    <div class="tab-panel" id="tab-challenge">
      <div id="ap-challenge"></div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ADMIN_PW = 'meslap2024';
  const SESSION_KEY = '__admin_sess__';
  const CODES_KEY   = 'meslap_invite_codes';
  const AUTH_KEY    = 'meslap_auth';
  const HL_KEY      = 'meslap_highlights';
  const BM_KEY      = 'meslap_bookmarks';
  const NOTES_KEY   = 'meslap_notes';

  /* ── 인증 ── */
  function doLogin() {
    const pw = document.getElementById('pwInput').value;
    if (pw === ADMIN_PW) {
      sessionStorage.setItem(SESSION_KEY, '1');
      showDashboard();
    } else {
      document.getElementById('loginErr').classList.add('show');
    }
  }

  function doLogout() {
    sessionStorage.removeItem(SESSION_KEY);
    document.getElementById('adminView').classList.remove('show');
    document.getElementById('loginView').style.display = 'flex';
    document.getElementById('pwInput').value = '';
    document.getElementById('loginErr').classList.remove('show');
  }

  function showDashboard() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('adminView').classList.add('show');
    renderDash();
    renderCodes();
    renderReader();
  }

  /* ── 탭 전환 ── */
  function switchTab(id) {
    document.querySelectorAll('.admin-tab').forEach(b =>
      b.classList.toggle('active', (b.dataset.tab || b.dataset.p) === id));
    document.querySelectorAll('.tab-panel').forEach(p =>
      p.classList.toggle('active', p.id === 'tab-' + id));
    if (id === 'challenge') renderChallenge();
  }

  /* ── lsGet 헬퍼 ── */
  function lsGet(key, def) {
    try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(def)); } catch(e) { return def; }
  }

  /* ── 대시보드 ── */
  function renderDash() {
    try {
      const hls   = JSON.parse(localStorage.getItem(HL_KEY)    || '[]');
      const bms   = JSON.parse(localStorage.getItem(BM_KEY)    || '[]');
      const notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]');
      const auth  = JSON.parse(localStorage.getItem(AUTH_KEY)  || 'null');

      document.getElementById('statGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-label">하이라이트</div>
          <div class="stat-value">${hls.length}</div>
          <div class="stat-sub">저장된 구절</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">책갈피</div>
          <div class="stat-value">${bms.length}</div>
          <div class="stat-sub">저장된 위치</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">메모·기록</div>
          <div class="stat-value">${notes.length}</div>
          <div class="stat-sub">작성한 메모</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">로그인</div>
          <div class="stat-value" style="font-size:16px">${auth ? auth.name || '있음' : '없음'}</div>
          <div class="stat-sub">${auth ? auth.email || '' : '비로그인'}</div>
        </div>
      `;

      // LS 항목 목록
      const keys = Object.keys(localStorage).filter(k => k.startsWith('meslap'));
      let rows = '';
      keys.forEach(k => {
        const raw = localStorage.getItem(k) || '';
        const size = new Blob([raw]).size;
        rows += `<div class="info-row">
          <span class="info-key">${k}</span>
          <span class="info-val">${size >= 1024 ? (size/1024).toFixed(1)+'KB' : size+'B'}</span>
        </div>`;
      });
      document.getElementById('lsItems').innerHTML = rows || '<div class="info-row"><span class="info-key">데이터 없음</span></div>';
    } catch(e) { console.error(e); }
  }

  /* ── 초대코드 ── */
  function getCodes() {
    try { return JSON.parse(localStorage.getItem(CODES_KEY) || '[]'); } catch(e) { return []; }
  }
  function saveCodes(arr) { localStorage.setItem(CODES_KEY, JSON.stringify(arr)); }

  function renderCodes() {
    const codes = getCodes();
    const el = document.getElementById('codeList');
    if (!codes.length) {
      el.innerHTML = '<div style="color:var(--ink3);font-size:14px;padding:8px 0">저장된 코드가 없습니다</div>';
      return;
    }
    el.innerHTML = codes.map((c, i) => `
      <div class="code-item">
        <span class="code-text">${c}</span>
        <div style="display:flex;gap:6px">
          <button class="code-copy-btn" onclick="copyCode('${c}')">복사</button>
          <button class="code-copy-btn" style="background:var(--bg2);color:var(--red);border:1px solid #E8C8C0" onclick="deleteCode(${i})">삭제</button>
        </div>
      </div>
    `).join('');
  }

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 8; i++) code += chars[Math.floor(Math.random() * chars.length)];
    const codes = getCodes();
    codes.unshift(code);
    saveCodes(codes);
    renderCodes();
    showToast('코드 생성: ' + code);
  }

  function copyCode(code) {
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => showToast('코드 복사됨 ✓'));
    else showToast(code);
  }

  function deleteCode(idx) {
    if (!confirm('이 코드를 삭제할까요?')) return;
    const codes = getCodes();
    codes.splice(idx, 1);
    saveCodes(codes);
    renderCodes();
  }

  /* ── 독자 정보 ── */
  function renderReader() {
    let auth = null;
    try { auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch(e) {}
    const el = document.getElementById('readerInfo');
    if (!auth) {
      el.innerHTML = '<div class="info-row"><span class="info-key">로그인 정보 없음</span></div>';
      return;
    }
    const fields = [
      ['이름', auth.name || '-'],
      ['이메일', auth.email || '-'],
      ['역할', auth.role || '-'],
      ['가입일', auth.createdAt || '-'],
      ['기기 LS 키 수', Object.keys(localStorage).filter(k=>k.startsWith('meslap')).length + '개'],
    ];
    el.innerHTML = fields.map(([k,v]) => `
      <div class="info-row">
        <span class="info-key">${k}</span>
        <span class="info-val">${v}</span>
      </div>
    `).join('');
  }

  /* ── 토스트 ── */
  let _toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  /* ── 위험 ── */
  function clearAllData() {
    if (!confirm('⚠️ 모든 MeslapBooks 로컬 데이터를 삭제할까요?\n(하이라이트·책갈피·메모·인증 정보 전부)')) return;
    Object.keys(localStorage).filter(k => k.startsWith('meslap')).forEach(k => localStorage.removeItem(k));
    renderDash();
    renderCodes();
    renderReader();
    showToast('모든 데이터가 초기화됐습니다');
  }

  /* ── 챌린지 ── */
  function renderChallenge() {
    const el = document.getElementById('ap-challenge');
    if (!el) return;

    // localStorage에서 streak 데이터 읽기
    let s = {};
    try { s = JSON.parse(localStorage.getItem('meslap_streak') || '{}'); } catch(e) {}

    let hlCount = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('meslap_marks_')) hlCount += lsGet(k, []).length;
      }
    } catch(e) {}

    const d = {
      streak: s.streak || 0,
      best: Math.max(s.best||0, s.streak||0),
      totalDays: s.totalDays || 0,
      hlCount,
      memoCount: lsGet('meslap_notes', []).length,
      bmkCount: lsGet('meslap_bookmarks', []).length,
    };

    const BADGES = [
      { icon:'📖', name:'첫 독서',       earned: d.totalDays >= 1 },
      { icon:'🔥', name:'3일 연속',       earned: d.streak >= 3 },
      { icon:'⚡', name:'7일 연속',       earned: d.streak >= 7 },
      { icon:'🏆', name:'30일 연속',      earned: d.streak >= 30 },
      { icon:'🖊️', name:'하이라이트 10', earned: d.hlCount >= 10 },
      { icon:'💛', name:'하이라이트 50', earned: d.hlCount >= 50 },
      { icon:'📝', name:'메모 5개',        earned: d.memoCount >= 5 },
      { icon:'🔖', name:'책갈피 10',       earned: d.bmkCount >= 10 },
    ];

    const earnedCount = BADGES.filter(b => b.earned).length;

    el.innerHTML = `
      <div class="admin-sec">
        <div class="admin-sec-lbl">독서 현황</div>
        <div class="admin-stat-row">
          <div class="admin-stat"><div class="admin-stat-val">${d.streak}</div><div class="admin-stat-key">현재 streak</div></div>
          <div class="admin-stat"><div class="admin-stat-val">${d.best}</div><div class="admin-stat-key">최고 streak</div></div>
          <div class="admin-stat"><div class="admin-stat-val">${d.totalDays}</div><div class="admin-stat-key">총 독서일</div></div>
        </div>
      </div>
      <div class="admin-sec">
        <div class="admin-sec-lbl">배지 (${earnedCount}/${BADGES.length})</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">
          ${BADGES.map(b => `
            <div style="text-align:center;padding:10px 4px;border-radius:10px;background:${b.earned?'var(--gold-bg)':'var(--bg2)'};border:1.5px solid ${b.earned?'var(--gold)':'var(--line)'}">
              <div style="font-size:22px">${b.icon}</div>
              <div style="font-size:10px;font-weight:600;color:${b.earned?'var(--gold)':'var(--ink3)'};margin-top:4px;word-break:keep-all;line-height:1.3">${b.name}</div>
            </div>`).join('')}
        </div>
      </div>`;
  }

  /* ── 초기화 ── */
  if (sessionStorage.getItem(SESSION_KEY) === '1') {
    showDashboard();
  }
</script>
</body>
</html>
